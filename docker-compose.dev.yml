# docker-compose.dev.yml — desarrollo del panel (backend) únicamente.
#
# Proyecto aislado (`name: bedrockpanel-dev`) y nombres de contenedor propios
# para NO colisionar con la pila de producción (docker-compose.prod.yml), que
# usa el mismo servicio `postgres` y el mismo proyecto por defecto (nombre del
# directorio). Si ambos stacks comparten nombre de contenedor, `start`/`up` de
# prod puede reutilizar el postgres de dev (que no tiene healthcheck) y falla
# con "dependency ... has no healthcheck configured".
name: bedrockpanel-dev
services:
  postgres:
    image: postgres:16
    container_name: bedrockpanel-postgres-dev
    environment:
      POSTGRES_USER: bedrockpanel
      POSTGRES_PASSWORD: bedrockpanel_dev
      POSTGRES_DB: bedrockpanel
    ports:
      - "5433:5432"
    volumes:
      - bedrockpanel-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
  panel:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dev
    container_name: bedrockpanel-dev-panel
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend/src:/workspace/apps/backend/src
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/bedrockpanel:/var/lib/bedrockpanel
    environment:
      BEDROCK_PANEL_DATABASE_URL: postgresql+psycopg://bedrockpanel:bedrockpanel_dev@postgres:5432/bedrockpanel
      BEDROCK_PANEL_DEBUG: "true"
      BEDROCK_PANEL_LOG_LEVEL: "DEBUG"
      BEDROCK_PANEL_SERVER_PUBLIC_HOST: ${BEDROCK_PANEL_SERVER_PUBLIC_HOST:-localhost}
      BEDROCK_PANEL_MONITORING_PROBE_HOST: "172.18.0.1"
    depends_on:
      - postgres

volumes:
  bedrockpanel-pgdata: