[alembic]
script_location = src/app/infrastructure/db/alembic
prepend_sys_path = src
# URL de conexión por defecto; se puede sobreescribir con la variable de
# entorno BEDROCK_PANEL_DATABASE_URL (ver env.py). PostgreSQL aún no se
# levanta en desarrollo (tarea esqueleto); se usará en la Fase A.
sqlalchemy.url = postgresql+psycopg://panel:panel@localhost:5432/panel

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
