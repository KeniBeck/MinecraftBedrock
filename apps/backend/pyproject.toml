[project]
name = "bedrockpanel-backend"
version = "0.1.0"
description = "BedrockPanel backend — monolith modular para administrar servidores Minecraft Bedrock sobre Docker (TDD v0.1)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "docker>=7.1",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "zstandard>=0.23",
    "croniter>=6.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "types-croniter>=6.2.4.20260711",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "N"]

[tool.ruff.lint.per-file-ignores]
# `Depends(factory)` en defaults es el patrón idiomático de FastAPI.
"src/app/modules/*/api/router.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
files = ["src", "tests"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
# docker-py no distribuye py.typed; el adaptador es el único consumidor.
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: pruebas que requieren un daemon Docker real (uv run pytest -m integration)",
]
addopts = "-m 'not integration'"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
