# nginx para el frontend de BedrockPanel (producción).
#
# Contrato de red (idéntico al proxy de dev en `vite.config.ts`):
#   - Sirve el SPA estático en `/`.
#   - `/api` es proxy inverso hacia el backend (REST + WebSocket).
#     - REST: `proxy_pass http://backend:8000`.
#     - WS: `Upgrade`/`Connection` + `http_version 1.1` (backend `/ws` y
#       los WS por servidor bajo `/api/v1/...`).
# Define el backend por su nombre de servicio en Docker (`backend`).
#
# El API del panel vive bajo `Settings.api_prefix = /api/v1` (bootstrap/config),
# y el gateway WS global es `GET /ws` (Fase H, módulo Notification).

upstream bedrock_panel_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Logging estructurado (json) para observabilidad.
    access_log /var/log/nginx/access.log main;

    # Gzip de estáticos por defecto.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/wasm image/webp font/woff2;

    # Servir los activos con hash de Vite con cache larga (inmutable).
    location ~* \.(?:js|css|map|webp|png|svg|woff2|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API REST del backend.
    location /api/ {
        proxy_pass         http://bedrock_panel_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 2g;   # importación de mundos (Settings.world_max_import_bytes)
    }

    # WebSocket global del panel (Notification): GET /ws.
    location /ws {
        proxy_pass         http://bedrock_panel_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: cualquier otra ruta devuelve index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}