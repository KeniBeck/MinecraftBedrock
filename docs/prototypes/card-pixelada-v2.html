/*
  v2 — notas para vos, Deyler:
  - Se quitaron los cortes diagonales (clip-path): un bloque de Minecraft
    siempre es 90°, sin diagonales. El "bisel de dos tonos" ahora es la
    fuente principal del efecto 3D (claro arriba-izq / oscuro abajo-der =
    bloque saliente; al revés = slot hundido, como en el inventario real).
  - La textura de las cards ya NO es un gradiente repetido: es ruido de
    píxeles real (grid 16×16, la resolución clásica de una textura de
    Minecraft) renderizado como SVG embebido y escalado con
    image-rendering:pixelated, así que se ve granulado de verdad, no liso.
  - El avatar ahora vive "dentro" de un slot hundido (como si fuera un
    ítem en el inventario), con el mismo sistema de bisel pero invertido.
  - Hover = el resaltado blanco translúcido que tira Minecraft cuando
    pasás el mouse sobre un slot, en vez de un blur/scale genérico.
  - La corona ya no es el emoji 👑 (que rompía la ilusión pixel-art):
    ahora es un ícono de 5×3 píxeles dibujado a puro box-shadow.
  Si preferís volver a las esquinas cortadas, avisame y las regreso.
*/
:root{
  --bg-deep:#0b0d17;
  --border:rgba(255,255,255,.08);
  --emerald:#34d399;
  --emerald-strong:#10b981;
  --amber:#f59e0b;
  --text:#e6e8f0;
  --text-dim:#8b8fa3;
  --pixel:"Press Start 2P", monospace;
  --bevel-hi:rgba(255,255,255,.16);
  --bevel-lo:rgba(0,0,0,.64);
  --seal:#000;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 15%, rgba(139,92,246,.25), transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(16,185,129,.12), transparent 40%),
    var(--bg-deep);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:28px;
  padding:48px 20px;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
h1{
  display:flex;
  align-items:center;
  color:var(--text);
  font-family:var(--pixel);
  letter-spacing:1px;
  font-size:11px;
  line-height:1.8;
  text-transform:uppercase;
  opacity:.85;
  margin:0 0 8px;
}
.chip{
  display:inline-block;
  min-width:14px;
  margin-left:9px;
  padding:3px 5px;
  background:var(--emerald-strong);
  color:#052e1f;
  font-family:var(--pixel);
  font-size:9px;
  text-align:center;
  box-shadow:
    inset 1px 1px 0 rgba(255,255,255,.35),
    inset -1px -1px 0 rgba(0,0,0,.4);
}
.board{
  display:flex;
  flex-wrap:wrap;
  gap:30px;
  justify-content:center;
  max-width:760px;
}

/* ---- card = bloque: rectángulo puro + bisel de píxeles duro + textura real ---- */

/* resaltado de hover = el "wash" blanco que Minecraft tira sobre un slot con el mouse encima */
.card::after{
  content:"";
  position:absolute; inset:0;
  background:rgba(255,255,255,0);
  transition:background .08s linear;
  pointer-events:none;
}
.card:hover::after{ background:rgba(255,255,255,.10); }
.card:hover{
  transform:translateY(-2px);
  box-shadow:
    inset 2px 2px 0 0 var(--bevel-hi),
    inset -2px -2px 0 0 var(--bevel-lo),
    inset 0 0 0 1px var(--seal),
    0 6px 0 0 rgba(0,0,0,.45);
}
@media (prefers-reduced-motion: reduce){
  .card, .card:hover{ transition:none; transform:none; }
}

/* ---- avatar = un slot hundido con un ítem pixel-art adentro ---- */
.voxel-avatar{
  width:44px;
  height:44px;
  border-radius:0;
  position:relative;
  flex:0 0 auto;

/* ---- corona: ya no es emoji, es pixel-art puro (grid 5×3) a box-shadow ---- */
.crown{
  position:relative;
  display:inline-block;
  width:10px; height:6px;
  flex:0 0 auto;
}
.crown::before{
  content:"";
  position:absolute; left:0; top:0;
  width:2px; height:2px;
  background:var(--amber);
  box-shadow:
    4px 0 0 var(--amber), 8px 0 0 var(--amber),
    0 2px 0 var(--amber), 2px 2px 0 var(--amber), 4px 2px 0 var(--amber), 6px 2px 0 var(--amber), 8px 2px 0 var(--amber),
    0 4px 0 var(--amber), 2px 4px 0 var(--amber), 4px 4px 0 var(--amber), 6px 4px 0 var(--amber), 8px 4px 0 var(--amber);
}

/* ---- cuerpo de la card ---- */
.info{ flex:1; min-width:0; }
.name-row{ display:flex; align-items:center; gap:6px; }
.name{
  color:var(--text);
  font-weight:600;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.role{ color:var(--text-dim); font-size:11px; margin-top:2px; text-transform:uppercase; letter-spacing:.5px; }

.signal{
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
}
.bars{ display:flex; align-items:flex-end; gap:2px; height:14px; }
.bars i{
  width:3px;
  background:var(--emerald);
  border-radius:0;
  display:block;
}
.bars i:nth-child(1){height:5px}
.bars i:nth-child(2){height:8px}
.bars i:nth-child(3){height:11px}
.bars i:nth-child(4){height:14px}
.ms{ color:var(--text-dim); font-size:10px; font-family:var(--pixel); letter-spacing:.5px; }
